services:

  carla-server:
    # TODO(openads): replace the feature-branch CI image with the release tag (v1.0.0-x.y.z) when releasing.
    image: ghcr.io/openads-project/carla-simulator:server-slim_feature-carla-1.0_ci
    environment:
      CARLA_PORT: 2000
      # The native ROS 2 interface runs on Zenoh and needs a Zenoh router (rmw_zenohd).
      # ZENOH_CONFIG_OVERRIDE patches individual keys of the Zenoh session config
      # shipped with CARLA (peer mode, tcp/localhost:7447).
      ZENOH_CONFIG_OVERRIDE: >-
        connect/endpoints=["tcp/zenoh-router:7447"]
    command:
      - /bin/bash
      - -ic
      - |
        ./CarlaUnreal.sh \
          -nosound \
          --ros2 \
          --rmw=zenoh \
          -carla-rpc-port=$${CARLA_PORT}
    expose:
      - "2000"
      - "2001"
      - "2002"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/2000"]
      start_period: 30s
      start_interval: 1s
      interval: 2s
      timeout: 1s
      retries: 3

  carla-server-offscreen:
    extends:
      service: carla-server
    command:
      - /bin/bash
      - -ic
      - |
        ./CarlaUnreal.sh \
          -nosound \
          -RenderOffScreen \
          --ros2 \
          --rmw=zenoh \
          -carla-rpc-port=$${CARLA_PORT}
