openadservice:
  name: carla-client
  # TODO(openads): replace the feature-branch CI image with the release tag (v1.0.0-x.y.z) when releasing.
  image: ghcr.io/openads-project/carla-simulator:client_feature-carla-1.0_ci
  gpu: true
  shm: false
  x11Display: ":0"
  # Override this with the host's Xauthority file when access is not granted via xhost.
  x11XauthorityFile: /dev/null
  env:
    CARLA_HOST: carla-server
    CARLA_PORT: 2000
    __NV_PRIME_RENDER_OFFLOAD: 1
    __GLX_VENDOR_LIBRARY_NAME: nvidia
  args:
  - sleep
  - infinity
  dependsOn:
  - host: carla-server
    port: 2000
  enableService: false
