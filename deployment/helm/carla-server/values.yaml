openadservice:
  name: carla-server
  image: ghcr.io/openads-project/carla-simulator:server-slim_v0.10.0-1.1.1
  gpu: true
  shm: true
  env:
    # When changing this port, also update expose below (RPC, RPC + 1, RPC + 2).
    CARLA_PORT: 2000
  args:
  - /bin/bash
  - -ic
  - |
    ./Linux/CarlaUnreal.sh \
      -nosound \
      -RenderOffScreen \
      --ros2 \
      -carla-rpc-port=${CARLA_PORT}
  enableService: true
  expose:
  - port: 2000
    targetPort: 2000
    protocol: TCP
  - port: 2001
    targetPort: 2001
    protocol: TCP
  - port: 2002
    targetPort: 2002
    protocol: TCP
