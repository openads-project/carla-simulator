openadservice:
  name: carla-server
  # TODO(openads): replace the feature-branch CI image with the release tag (v1.0.0-x.y.z) when releasing.
  image: ghcr.io/openads-project/carla-simulator:server-slim_feature-carla-1.0_ci
  gpu: true
  shm: true
  env:
    # When changing this port, also update expose below (RPC, RPC + 1, RPC + 2).
    CARLA_PORT: 2000
  # The native ROS 2 interface runs on Zenoh and needs a Zenoh router
  # (rmw_zenohd, see the zenoh-router chart) to connect to.
  rmw:
    zenoh:
      # Rendered into ZENOH_CONFIG_OVERRIDE, which patches individual keys of the
      # Zenoh session config shipped with CARLA (peer mode, tcp/localhost:7447).
      configOverrides:
        connect/endpoints: ["tcp/zenoh-router:7447"]
  args:
  - /bin/bash
  - -ic
  - |
    ./CarlaUnreal.sh \
      -nosound \
      -RenderOffScreen \
      --ros2 \
      --rmw=zenoh \
      -carla-rpc-port=${CARLA_PORT}
  enableService: true
  expose:
  - port: 2000
    targetPort: 2000
    protocol: TCP
  - port: 2001
    targetPort: 2001
    protocol: TCP
  - port: 2002
    targetPort: 2002
    protocol: TCP
